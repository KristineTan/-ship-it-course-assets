<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Push That Wouldn't Go — Interactive Scenario</title>
<style>
  :root{
    --navy:#1e2a4a; --blue:#2563eb; --blue-dark:#1d4ed8;
    --purple:#7c3aed; --purple-soft:#f4f0fe;
    --ink:#232838; --muted:#5b6478; --line:#e6e9f2;
    --bg:#f6f8fc; --terminal:#141a2b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:700px;margin:0 auto;padding:32px 20px 72px}
  header.top{margin-bottom:26px}
  header.top h1{color:var(--navy);font-size:1.65rem;margin:0 0 6px;line-height:1.25}
  header.top p{color:var(--muted);margin:0;font-size:.94rem}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:28px;box-shadow:0 2px 14px rgba(30,42,74,.06)}
  .kicker{font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--purple);font-weight:700;margin:0 0 10px}
  .progress{font-size:.8rem;color:var(--muted);margin:0 0 6px;font-weight:600}
  .pbar{display:flex;gap:4px;margin:2px 0 8px}
  .pbar .seg{flex:1;height:8px;border-radius:99px;border:none;padding:0;background:var(--line);transition:background .15s}
  .pbar .seg.done{background:var(--blue);cursor:pointer}
  .pbar .seg.done:hover{background:var(--blue-dark)}
  .pbar .seg.now{background:var(--navy);cursor:default}
  .pbar .seg.locked{background:var(--line);opacity:.45;cursor:not-allowed}
  .pbar-cap{font-size:.78rem;color:var(--muted);margin:0 0 20px;font-weight:600}
  .cast{display:flex;gap:20px;margin:2px 0 18px}
  .cast figure{margin:0;text-align:center}
  .cast img.actor{width:150px;flex:0 0 150px}
  .cast figcaption{margin-top:8px}
  .cast figcaption b{display:block;color:var(--ink);font-size:.95rem}
  .cast figcaption span{display:block;font-size:.78rem;color:var(--muted)}
  h2.scene-title{color:var(--navy);margin:0 0 12px;font-size:1.28rem;line-height:1.35}
  p{margin:0 0 14px}
  .actor-row{display:flex;gap:22px;align-items:flex-start;margin-bottom:4px}
  img.actor{width:185px;flex:0 0 185px;border-radius:14px;object-fit:cover;
    aspect-ratio:3/3.8;box-shadow:0 4px 18px rgba(30,42,74,.16)}
  .dialogue{flex:1;min-width:0}
  .who{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;margin:0 0 4px}
  .who.maya{color:var(--blue)} .who.jordan{color:var(--purple)}
  .jordan-row{display:flex;gap:12px;align-items:flex-start;margin:2px 0 16px}
  img.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;flex:0 0 54px;
    border:2px solid #e2d9fd;box-shadow:0 2px 8px rgba(124,58,237,.15)}
  .bubble{background:var(--purple-soft);border-radius:4px 14px 14px 14px;
    padding:13px 16px;margin:0;flex:1}
  .bubble p{margin:0}
  .terminal{background:var(--terminal);color:#e8ecf7;border-radius:10px;padding:14px 16px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86rem;
    margin:0 0 16px;overflow-x:auto;white-space:pre-wrap}
  .versus{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
  .versus .side{background:#f6f8fc;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;font-size:.92rem}
  .versus .side b{display:block;font-size:.72rem;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
  .choices{margin-top:18px;display:grid;gap:10px}
  button.choice{display:block;width:100%;text-align:left;background:#fff;
    border:2px solid var(--line);border-radius:12px;padding:14px 16px;
    font-size:1rem;color:var(--ink);cursor:pointer;line-height:1.45;
    transition:border-color .15s,box-shadow .15s}
  button.choice:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(37,99,235,.12)}
  .btn{display:inline-block;background:var(--blue);color:#fff;border:none;border-radius:12px;
    padding:13px 28px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:8px}
  .btn:hover{background:var(--blue-dark)}
  .btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue)}
  .btn.ghost:hover{background:#eff4ff}
  .verdict{border-radius:12px;padding:16px 18px;margin:0 0 16px}
  .verdict.good{background:#eaf7ee;border:1px solid #bfe6c9}
  .verdict.bad{background:#fdf1f1;border:1px solid #f3c1c1}
  .verdict .tag{font-size:.74rem;font-weight:800;letter-spacing:.07em;
    text-transform:uppercase;margin:0 0 8px}
  .verdict.good .tag{color:#1c7a3d} .verdict.bad .tag{color:#b33737}
  .verdict p{margin:0 0 8px} .verdict p:last-child{margin-bottom:0}
  .transfer{list-style:none;margin:4px 0 10px;padding:0}
  .transfer li{padding:9px 0 9px 32px;position:relative;border-bottom:1px dashed var(--line)}
  .transfer li:last-child{border-bottom:none}
  .transfer li::before{content:"✓";position:absolute;left:6px;color:var(--blue);font-weight:800}
  footer.note{margin-top:22px;font-size:.82rem;color:var(--muted)}
  @media(max-width:600px){
    .actor-row{flex-direction:column}
    img.actor{width:150px;flex-basis:auto}
    .cast img.actor{width:118px;flex-basis:auto}
    .versus{grid-template-columns:1fr}
    .card{padding:20px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>The Push That Wouldn&rsquo;t Go</h1>
    <p>A self-paced Git recovery scenario. You&rsquo;re helping Maya recover a rejected Friday push. Jordan, your tech coach, talks you through it &mdash; no timers, no scores, no dead ends.</p>

  <div class="card" id="stage" role="main" aria-live="polite"></div>
  <footer class="note">Prototype for the &ldquo;Ship It&rdquo; Rise course &middot; Lesson 2 safety-net finale</footer>
</div>

  maya:"Both ideas are still here, the history is intact, and the online version is current.",
  jordan:"That is the safety net: never overpower the warning. Reconcile, record, push, and verify.",
  completion:"You protected both versions and recovered without deleting history.",
  transfer:["Read the message","Pull","Inspect","Resolve","Stage and commit","Push","Verify"]}
};

const ORDER=Object.keys(NODES);
let furthest=0;
function nodeLabel(key){
  const n=NODES[key];
  if(key==="intro")return"Start";
  if(n.kind==="decision")return"Decision "+n.n+" of 5";
  if(n.kind==="success")return"Complete";
  return n.kicker?n.kicker.replace(/&[^;]+;/g,""):"Story";
}
function progressBar(){
  const idx=ORDER.indexOf(current);
  let segs="";
  for(let i=0;i<ORDER.length;i++){
    const cls=i<idx?"seg done":(i===idx?"seg now":(i<=furthest?"seg done":"seg locked"));
    const ok=i<=furthest&&i!==idx;
    segs+='<button class="'+cls+'" data-jump="'+i+'"'
      +(ok?"":" disabled")+' title="'+nodeLabel(ORDER[i])+'" aria-label="'+nodeLabel(ORDER[i])+'"</button>';
  }
  const nd=NODES[current];
  let cap="Step "+(idx+1)+" of "+ORDER.length;
  if(nd.kind==="decision")cap+=" \u00b7 Decision "+nd.n+" of 5";
  else if(nd.kind==="success")cap+=" \u00b7 Complete";
  else if(current!=="intro"&&nd.kicker)cap+=" \u00b7 "+nd.kicker.replace(/&[^;]+;/g,"");
  return '<div class="pbar" role="navigation" aria-label="Scenario progress">'+segs+'</div>'
    +'<p class="pbar-cap">'+cap+'</p>';
}
function bindJump(){
  stage.querySelectorAll("[data-jump]").forEach(function(b){
    b.addEventListener("click",function(){
      const i=parseInt(b.getAttribute("data-jump"),10);
      if(i<=furthest){current=ORDER[i];render();}
    });
  });
}
function paint(h){
  stage.innerHTML=progressBar()+h;
  bindNav();bindJump();
  window.scrollTo({top:0,behavior:"smooth"});
}
const stage = document.getElementById("stage");
let current = "intro";

function actorImg(key,alt){
  return '<img class="actor" src="'+IMGS[key]+'" alt="'+alt+'">';
}
function jordanRow(t){
  return '<div class="jordan-row"><img class="avatar" src="'+IMGS.jordan+'" alt="Jordan">'
    +'<div><span class="who jordan">Jordan &middot; tech coach</span><div class="bubble"><p>'+t+'</p></div></div></div>';
}
function bindNav(){
  stage.querySelectorAll("[data-to]").forEach(function(b){
    b.addEventListener("click",function(){ current=b.getAttribute("data-to"); render(); });
  });
}
function dialogueInner(n){
  let h="";
  if(n.kicker) h+='<p class="kicker">'+n.kicker+'</p>';
  if(n.title) h+='<h2 class="scene-title">'+n.title+'</h2>';
  return h;
}
function renderScene(n){
  let h;
  if(n.duo){
    h='<div class="cast">'
      +'<figure>'+actorImg(n.m,"Maya")+'<figcaption><b>Maya</b><span>You&rsquo;re helping her</span></figcaption></figure>'
      +'<figure><img class="actor" src="'+IMGS.jordan+'" alt="Jordan"><figcaption><b>Jordan</b><span>Your tech coach</span></figcaption></figure>'
      +'</div><div class="dialogue">'+dialogueInner(n);
  }else{
    h='<div class="actor-row">'+actorImg(n.m,"Maya")+ '<div class="dialogue">'
      + dialogueInner(n);
  }
  n.paras.forEach(function(p){ h+='<p>'+p+'</p>'; });
  if(n.terminal) h+='<div class="terminal">'+n.terminal+'</div>';
  if(n.versus) h+='<div class="versus">'
    +'<div class="side"><b>Incoming &middot; from GitHub</b>'+n.versus.incoming+'</div>'
    +'<div class="side"><b>Current &middot; Maya&rsquo;s local</b>'+n.versus.current+'</div></div>';
  h+='</div>';
  if(!n.duo)h+='</div>';
  if(n.jordan) h+=jordanRow(n.jordan);
  h+='<button class="btn" data-to="'+n.cta.to+'">'+n.cta.label+'</button>';
  paint(h);
}
function renderDecision(n){
  let h='<div class="actor-row">'+actorImg(n.m,"Maya thinking")
    +'<div class="dialogue"><h2 class="scene-title">'+n.title+'</h2><p>'+n.prompt+'</p></div></div>'
    +'<div class="choices">';
  n.choices.forEach(function(c,i){ h+='<button class="choice" data-i="'+i+'">'+c.label+'</button>'; });
  h+='</div>';
  paint(h);
  stage.querySelectorAll(".choice").forEach(function(b){
    b.addEventListener("click",function(){ choose(n,parseInt(b.getAttribute("data-i"),10)); });
  });
}
function choose(n,i){
  const c=n.choices[i];
  let h="";
  if(c.good){
    h='<div class="actor-row">'+actorImg("happy","Maya relieved")
      +'<div class="dialogue"><div class="verdict good"><p class="tag">Best choice</p><p>'+c.note+'</p></div></div></div>'
      +'<button class="btn" data-to="'+c.to+'">Continue</button>';
  }else{
    h='<div class="actor-row">'+actorImg("dismayed","Maya dismayed")
      +'<div class="dialogue"><div class="verdict bad"><p class="tag">Needs another look</p>';
    if(c.happening) h+='<p>'+c.happening+'</p>';
    if(c.maya) h+='<span class="who maya">Maya</span><p>'+c.maya+'</p>';
    h+='</div></div></div>';
    if(c.jordan) h+=jordanRow(c.jordan);
    h+='<button class="btn ghost" data-to="'+c.back+'">Try again</button>';
  }
  paint(h);
}
function renderSuccess(n){
  let h='<p class="kicker">Scenario complete</p>'
    +'<div class="actor-row">'+actorImg(n.m,"Maya happy")
    +'<div class="dialogue"><h2 class="scene-title">The push goes through</h2>'
    +'<span class="who maya">Maya</span><p>'+n.maya+'</p></div></div>'
    +jordanRow(n.jordan)
    +'<div class="verdict good"><p class="tag">'+n.completion+'</p></div>'
    +'<p><b>Transfer cue &mdash; next time a push is rejected:</b></p><ul class="transfer">';
  n.transfer.forEach(function(t){ h+='<li>'+t+'</li>'; });
  h+='</ul><button class="btn" data-to="intro">Play again</button>';
  paint(h);
}
function render(){
  if(current==="intro")furthest=0;
  furthest=Math.max(furthest,ORDER.indexOf(current));
  const n=NODES[current];
  if(n.kind==="decision")renderDecision(n);
  else if(n.kind==="success")renderSuccess(n);
  else renderScene(n);
}
render();
</script>
</body>
</html>
